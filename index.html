<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Stock Opname</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 350px;
        }
        .login-box h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #004494;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .success { color: green; }
        .error { color: red; }
        .loading { color: #555; }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>Login Stock Opname</h1>

        <!-- Tempat menampilkan pesan error/sukses -->
        <div id="message"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan Username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan Password" required>
            </div>
            <button type="submit" id="submitBtn">Masuk</button>
        </form>
    </div>

    <script>
        // ==========================================================
        // GANTI URL INI DENGAN URL HASIL DEPLOY TERBARU (/exec)
        // Salin dari dialog "Kelola deployment" -> Aplikasi web -> URL
        // ==========================================================
        const scriptURL = 'https://script.google.com/macros/s/AKfycby9gI622UEI67Eo21xWWENF51MKsFtPy0MVrF3_JTfNy-oDBQeRVeCTJGmhtCMUBWyjbA/exec';

        // Proxy cadangan (hanya dipakai sebagai upaya TERAKHIR, mode GET)
        const proxyURL = 'https://api.allorigins.win/raw?url=';

        // Helper: kirim request dan parse JSON, kembalikan null jika gagal
        // (tidak throw, supaya alur fallback berikutnya tetap bisa jalan)
        async function tryFetchJson(url, options) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) return null;
                return await response.json();
            } catch (err) {
                console.warn('Percobaan fetch gagal:', err);
                return null;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            messageDiv.className = 'loading';
            messageDiv.textContent = 'Sedang menghubungi server...';
            submitBtn.disabled = true;

            let data = null;

            // 1) Coba POST langsung ke Apps Script
            const formData = new URLSearchParams();
            formData.append('action', 'login');
            formData.append('username', username);
            formData.append('password', password);

            data = await tryFetchJson(scriptURL, { method: 'POST', body: formData });

            // 2) Jika POST gagal (mis. diblokir CORS), coba GET langsung.
            //    doGet() di server juga sudah mendukung action=login.
            if (!data) {
                const getUrl = `${scriptURL}?action=login&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
                data = await tryFetchJson(getUrl);
            }

            // 3) Upaya terakhir: lewat proxy AllOrigins (mode GET, lebih stabil
            //    dibanding mode POST melalui proxy ini).
            if (!data) {
                const getUrl = `${scriptURL}?action=login&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
                data = await tryFetchJson(proxyURL + encodeURIComponent(getUrl));
            }

            submitBtn.disabled = false;

            if (!data) {
                messageDiv.className = 'error';
                messageDiv.textContent = 'Gagal terhubung ke server. Pastikan: (1) URL /exec sudah versi terbaru (redeploy setelah edit skrip), (2) akses web app diset "Siapa saja", (3) initSheet() sudah pernah dijalankan sekali di Apps Script.';
                return;
            }

            if (data.success) {
                messageDiv.className = 'success';
                messageDiv.textContent = 'Login Berhasil!';

                localStorage.setItem('userRole', data.role);
                localStorage.setItem('username', data.username || username);
                localStorage.setItem('userDepo', data.depo || '');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            } else {
                messageDiv.className = 'error';
                messageDiv.textContent = data.message || 'Username atau password salah.';
            }
        });
    </script>
</body>
</html>
