<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Stock Opname</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        .login-box h1 { font-size: 22px; margin-bottom: 20px; color: #333; text-align: center; }
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        #message { margin-top: 15px; text-align: center; font-size: 14px; }
        .success { color: green; } .error { color: red; } .loading { color: #555; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Login Stock Opname</h1>
        <div id="message"></div>
        <form id="loginForm">
            <div class="input-group"><input type="text" id="username" placeholder="Username" required></div>
            <div class="input-group"><input type="password" id="password" placeholder="Password" required></div>
            <button type="submit" id="submitBtn">Masuk</button>
        </form>
    </div>

    <script>
        // URL TIDAK DIHAPUS SESUAI PERMINTAAN
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwcLhFx1_0BmQ8qUTEcOthMzDOzyujDSJlscH6QXKCb91L0sE1ksaKrAVXfjAN4j4D7xw/exec';
        
        const proxyList = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?'
        ];

        // FUNGSI FETCH ANTI ERROR "Unexpected token"
        async function safeFetch(url, options = {}) {
            let res;
            try {
                res = await fetch(url, options);
            } catch (e) {
                // Coba proxy
                for (let proxy of proxyList) {
                    try {
                        const proxyUrl = proxy + encodeURIComponent(url);
                        res = await fetch(proxyUrl, { ...options, headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' } });
                        if (res.ok) break;
                    } catch (e2) { continue; }
                }
            }

            // Jika masih gagal total
            if (!res) throw new Error("Semua koneksi (langsung & proxy) gagal.");

            // 1. Cek apakah response OK
            if (!res.ok) {
                throw new Error(`Server Error: ${res.status} (URL /exec mungkin 404 atau belum di-deploy)`);
            }

            // 2. Cek tipe konten! Jika HTML, lempar error khusus
            const contentType = res.headers.get("content-type") || "";
            if (!contentType.includes("application/json")) {
                // Baca teks untuk memastikan (meskipun error akan dilempar)
                await res.text(); 
                throw new Error("Server tidak mengembalikan JSON. Kemungkinan besar: URL /exec salah, atau akses deployment Apps Script belum diset ke 'Siapa saja' (Anyone).");
            }

            // 3. Aman untuk di-parse JSON
            return res;
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            
            messageDiv.className = 'loading';
            messageDiv.textContent = "Menghubungi server...";
            submitBtn.disabled = true;

            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const response = await safeFetch(scriptURL, { method: 'POST', body: formData });
                const data = await response.json();

                if (data.success) {
                    messageDiv.className = 'success';
                    messageDiv.textContent = "Login Berhasil!";
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('userDepo', data.depo || '');
                    setTimeout(() => { window.location.href = "dashboard.html"; }, 800);
                } else {
                    messageDiv.className = 'error';
                    messageDiv.textContent = data.message || "Login gagal";
                }
            } catch (err) {
                console.error(err);
                messageDiv.className = 'error';
                messageDiv.textContent = err.message;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
