<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Stock Opname - Mode Klasik</title>
    <style>
        /* Reset dasar */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; }

        /* Layout Klasik (Sidebar Kiri) */
        .app-container { display: flex; min-height: 100vh; }
        
        /* Sidebar Kiri */
        .sidebar {
            width: 250px;
            background-color: #2c3e50; /* Warna Klasik */
            color: white;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 20px;
            text-align: center;
            background-color: #34495e;
            border-bottom: 2px solid #1abc9c;
        }
        .sidebar-header h2 { font-size: 18px; margin: 0; }
        
        .sidebar-menu { flex: 1; padding-top: 10px; }
        .menu-item {
            display: block;
            padding: 15px 20px;
            color: #ecf0f1;
            text-decoration: none;
            cursor: pointer;
            border-bottom: 1px solid #34495e;
            transition: 0.3s;
        }
        .menu-item:hover { background-color: #34495e; padding-left: 25px; }
        .menu-item.active { background-color: #1abc9c; color: white; font-weight: bold; }
        
        .sidebar-footer { padding: 20px; border-top: 1px solid #34495e; }

        /* Area Konten Utama (Kanan) */
        .main-content { flex: 1; padding: 20px; overflow-x: hidden; }
        .page-title { margin-bottom: 20px; color: #333; border-bottom: 2px solid #ddd; padding-bottom: 10px; }

        /* Komponen Konten yang Sudah Ada (Disimpan Semua) */
        #message { margin-bottom: 15px; text-align: center; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
        .loading { color: #555; }

        .filter-section { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;}
        .filter-group label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
        .filter-group select, .filter-group input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 150px;}
        .btn-filter { background-color: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .btn-reset { background-color: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }

        .form-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { background-color: #0056b3; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-top: 15px; font-size: 16px; width: 100%; }
        .btn-cancel { background-color: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; }

        .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #666; }
        .card p { margin: 0; font-size: 24px; font-weight: bold; color: #333; }

        .table-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 13px; }
        th { background-color: #f2f2f2; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .action-btn { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; font-size: 12px;}
        .btn-edit { background-color: #ffc107; color: white; }
        .btn-delete { background-color: #dc3545; color: white; }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- SIDEBAR KIRI (Menu Klasik) -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Stock Opname</h2>
            <small style="font-size: 11px;">Sistem Informasi</small>
        </div>
        
        <nav class="sidebar-menu">
            <a class="menu-item" onclick="scrollToSection('summaryCards')">📊 Dashboard / Rekap</a>
            <a class="menu-item" onclick="scrollToSection('formSection')">📝 Input Data</a>
            <a class="menu-item" onclick="scrollToSection('tableSection')">📋 Tabel Stok</a>
        </nav>

        <div class="sidebar-footer">
            <span id="userLabel" style="font-size: 12px; display: block; margin-bottom: 10px;">User: -</span>
            <button class="btn-filter" style="width: 100%; background-color: #dc3545; color: white;" onclick="logout()">🚪 Logout</button>
        </div>
    </div>

    <!-- KONTEN UTAMA (Kanan) -->
    <div class="main-content">
        <h2 class="page-title">Dashboard Stock Opname</h2>
        
        <div id="message"></div>

        <!-- Bagian Filter -->
        <div id="filterSection" class="filter-section">
            <div class="filter-group">
                <label>Bulan</label>
                <select id="filterBulan">
                    <option value="">Semua</option>
                    <option value="Januari">Januari</option>
                    <option value="Februari">Februari</option>
                    <option value="Maret">Maret</option>
                    <option value="April">April</option>
                    <option value="Mei">Mei</option>
                    <option value="Juni">Juni</option>
                    <option value="Juli">Juli</option>
                    <option value="Agustus">Agustus</option>
                    <option value="September">September</option>
                    <option value="Oktober">Oktober</option>
                    <option value="November">November</option>
                    <option value="Desember">Desember</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Tahun</label>
                <input type="number" id="filterTahun" placeholder="Contoh: 2024">
            </div>
            <div class="filter-group">
                <label>Depo</label>
                <select id="filterDepo">
                    <option value="">Semua</option>
                    <option value="Depo Farmasi IGD">Depo Farmasi IGD</option>
                    <option value="Depo Farmasi Rawat Jalan">Depo Farmasi Rawat Jalan</option>
                    <option value="Depo Farmasi Rawat Inap">Depo Farmasi Rawat Inap</option>
                    <option value="Depo Farmasi IBS">Depo Farmasi IBS</option>
                </select>
            </div>
            <button class="btn-filter" onclick="loadDataAndSummary()">Cari Data</button>
            <button class="btn-reset" onclick="resetFilter()">Reset</button>
        </div>

        <!-- Bagian Ringkasan (Summary) -->
        <div id="summaryCards" class="summary-cards">
            <div class="card"><h3>Total Item</h3><p id="totalItem">0</p></div>
            <div class="card"><h3>Total Nilai</h3><p id="totalNilaiDisplay">Rp 0</p></div>
            <div class="card"><h3>Total Obat</h3><p id="totalObat">Rp 0</p></div>
            <div class="card"><h3>Total BMHP</h3><p id="totalBMHP">Rp 0</p></div>
        </div>

        <!-- Bagian Form Input Data -->
        <div id="formSection" class="form-section">
            <h3 style="margin-bottom: 15px;">Input / Edit Data Stock</h3>
            <form id="itemForm">
                <input type="hidden" id="itemId">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Kode Barang</label>
                        <input type="text" id="kode" required>
                    </div>
                    <div class="form-group">
                        <label>Nama Item</label>
                        <input type="text" id="namaItem" required>
                    </div>
                    <div class="form-group">
                        <label>Kategori</label>
                        <select id="kategori">
                            <option value="Obat">Obat</option>
                            <option value="BMHP">BMHP</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Depo</label>
                        <select id="depo">
                            <option value="Depo Farmasi IGD">Depo Farmasi IGD</option>
                            <option value="Depo Farmasi Rawat Jalan">Depo Farmasi Rawat Jalan</option>
                            <option value="Depo Farmasi Rawat Inap">Depo Farmasi Rawat Inap</option>
                            <option value="Depo Farmasi IBS">Depo Farmasi IBS</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Satuan</label>
                        <input type="text" id="satuan" placeholder="cth: Tablet, Box, Botol" required>
                    </div>
                    <div class="form-group">
                        <label>Stok Awal</label>
                        <input type="number" id="stokAwal" value="0" oninput="autoCalc()">
                    </div>
                    <div class="form-group">
                        <label>Stok Masuk</label>
                        <input type="number" id="stokMasuk" value="0" oninput="autoCalc()">
                    </div>
                    <div class="form-group">
                        <label>Stok Keluar</label>
                        <input type="number" id="stokKeluar" value="0" oninput="autoCalc()">
                    </div>
                    <div class="form-group">
                        <label>Stok Akhir (Otomatis)</label>
                        <input type="number" id="stokAkhir" value="0" readonly style="background-color: #eee;">
                    </div>
                    <div class="form-group">
                        <label>Harga Satuan</label>
                        <input type="number" id="hargaSatuan" value="0" oninput="autoCalc()">
                    </div>
                    <div class="form-group">
                        <label>Total Nilai (Otomatis)</label>
                        <input type="number" id="totalNilai" value="0" readonly style="background-color: #eee;">
                    </div>
                </div>
                
                <div class="form-group" style="margin-top: 10px;">
                    <label>Bulan & Tahun Penilaian</label>
                    <div style="display: flex; gap: 10px;">
                        <select id="bulan" style="width: 50%;">
                            <option value="Januari">Januari</option>
                            <option value="Februari">Februari</option>
                            <option value="Maret">Maret</option>
                            <option value="April">April</option>
                            <option value="Mei">Mei</option>
                            <option value="Juni">Juni</option>
                            <option value="Juli">Juli</option>
                            <option value="Agustus">Agustus</option>
                            <option value="September">September</option>
                            <option value="Oktober">Oktober</option>
                            <option value="November">November</option>
                            <option value="Desember">Desember</option>
                        </select>
                        <input type="number" id="tahun" placeholder="Tahun (cth: 2024)" style="width: 50%;" required>
                    </div>
                </div>

                <button type="button" class="btn-submit" onclick="submitData()">Simpan Data</button>
                <button type="button" class="btn-cancel" onclick="resetForm()">Bersihkan Form</button>
            </form>
        </div>

        <!-- Bagian Tabel Data -->
        <div id="tableSection" class="table-section">
            <h3 style="margin-bottom: 10px;">Data Stock Opname</h3>
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Kode</th>
                        <th>Nama Item</th>
                        <th>Kategori</th>
                        <th>Depo</th>
                        <th>Stok Akhir</th>
                        <th>Harga</th>
                        <th>Total Nilai</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data akan dimuat via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // GANTI URL INI dengan URL hasil Deploy Web App Anda
    const scriptURL = 'https://script.google.com/macros/s/AKfycb.../exec';

    // Logika scroll menu sidebar
    function scrollToSection(id) {
        const el = document.getElementById(id);
        if(el) {
            el.scrollIntoView({ behavior: 'smooth' });
        }
    }

    // Cek Session Login
    const username = localStorage.getItem('username');
    const role = localStorage.getItem('userRole');
    const userDepo = localStorage.getItem('userDepo');

    if (!username || !role) {
        alert("Anda belum login! Silakan login terlebih dahulu.");
        window.location.href = "index.html";
    } else {
        document.getElementById('userLabel').innerText = `User: ${username} (${role})`;
        if (role === 'depo' && userDepo) {
            document.getElementById('depo').value = userDepo;
            document.getElementById('depo').disabled = true;
            document.getElementById('filterDepo').value = userDepo;
            document.getElementById('filterDepo').disabled = true;
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = "index.html";
    }

    // Auto Calculate
    function autoCalc() {
        const awal = parseFloat(document.getElementById('stokAwal').value) || 0;
        const masuk = parseFloat(document.getElementById('stokMasuk').value) || 0;
        const keluar = parseFloat(document.getElementById('stokKeluar').value) || 0;
        const harga = parseFloat(document.getElementById('hargaSatuan').value) || 0;
        
        const akhir = awal + masuk - keluar;
        const total = akhir * harga;

        document.getElementById('stokAkhir').value = akhir;
        document.getElementById('totalNilai').value = total;
    }

    function resetForm() {
        document.getElementById('itemForm').reset();
        document.getElementById('itemId').value = '';
        document.getElementById('stokAkhir').value = 0;
        document.getElementById('totalNilai').value = 0;
    }

    // Ambil Data dan Summary
    async function loadDataAndSummary() {
        const bulan = document.getElementById('filterBulan').value;
        const tahun = document.getElementById('filterTahun').value;
        const depo = document.getElementById('filterDepo').value;

        try {
            const summaryRes = await fetch(`${scriptURL}?action=getSummary&bulan=${bulan}&tahun=${tahun}&depo=${depo}`);
            const summary = await summaryRes.json();
            
            document.getElementById('totalItem').innerText = summary.totalItem || 0;
            document.getElementById('totalNilaiDisplay').innerText = "Rp " + formatRupiah(summary.totalNilai || 0);
            document.getElementById('totalObat').innerText = "Rp " + formatRupiah(summary.totalObat || 0);
            document.getElementById('totalBMHP').innerText = "Rp " + formatRupiah(summary.totalBMHP || 0);

            const dataRes = await fetch(`${scriptURL}?action=getData&bulan=${bulan}&tahun=${tahun}&depo=${depo}`);
            const dataJson = await dataRes.json();
            renderTable(dataJson.data);

        } catch (error) {
            console.error('Error loading data:', error);
            showMessage("Gagal mengambil data.", 'error');
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Belum ada data</td></tr>';
            return;
        }

        data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.Kode || ''}</td>
                <td>${item.NamaItem || ''}</td>
                <td>${item.Kategori || ''}</td>
                <td>${item.Depo || ''}</td>
                <td>${item.StokAkhir || 0}</td>
                <td>${formatRupiah(item.HargaSatuan || 0)}</td>
                <td>${formatRupiah(item.TotalNilai || 0)}</td>
                <td>
                    <button class="action-btn btn-edit" onclick="editData('${item.ID}')">Edit</button>
                    <button class="action-btn btn-delete" onclick="deleteData('${item.ID}')">Hapus</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function submitData() {
        const data = {
            action: 'save',
            bulan: document.getElementById('bulan').value,
            tahun: document.getElementById('tahun').value,
            items: [{
                kode: document.getElementById('kode').value,
                namaItem: document.getElementById('namaItem').value,
                kategori: document.getElementById('kategori').value,
                depo: document.getElementById('depo').value,
                satuan: document.getElementById('satuan').value,
                stokAwal: parseFloat(document.getElementById('stokAwal').value) || 0,
                stokMasuk: parseFloat(document.getElementById('stokMasuk').value) || 0,
                stokKeluar: parseFloat(document.getElementById('stokKeluar').value) || 0,
                stokAkhir: parseFloat(document.getElementById('stokAkhir').value) || 0,
                hargaSatuan: parseFloat(document.getElementById('hargaSatuan').value) || 0
            }]
        };

        const formData = new URLSearchParams();
        formData.append('action', 'save');
        formData.append('bulan', data.bulan);
        formData.append('tahun', data.tahun);
        formData.append('items', JSON.stringify(data.items));

        showMessage("Menyimpan data...", 'loading');
        try {
            const response = await fetch(scriptURL, { method: 'POST', body: formData });
            const result = await response.json();
            if (result.success) {
                showMessage(result.message, 'success');
                resetForm();
                loadDataAndSummary();
            } else {
                showMessage(result.error || 'Gagal menyimpan data', 'error');
            }
        } catch (error) {
            console.error(error);
            showMessage("Koneksi ke server gagal.", 'error');
        }
    }

    async function editData(id) {
        const bulan = document.getElementById('filterBulan').value;
        const tahun = document.getElementById('filterTahun').value;
        const depo = document.getElementById('filterDepo').value;
        const res = await fetch(`${scriptURL}?action=getData&bulan=${bulan}&tahun=${tahun}&depo=${depo}`);
        const json = await res.json();
        const item = json.data.find(d => d.ID === id);

        if (item) {
            document.getElementById('itemId').value = item.ID;
            document.getElementById('kode').value = item.Kode;
            document.getElementById('namaItem').value = item.NamaItem;
            document.getElementById('kategori').value = item.Kategori;
            document.getElementById('depo').value = item.Depo;
            document.getElementById('satuan').value = item.Satuan;
            document.getElementById('stokAwal').value = item.StokAwal;
            document.getElementById('stokMasuk').value = item.StokMasuk;
            document.getElementById('stokKeluar').value = item.StokKeluar;
            document.getElementById('stokAkhir').value = item.StokAkhir;
            document.getElementById('hargaSatuan').value = item.HargaSatuan;
            document.getElementById('totalNilai').value = item.TotalNilai;
            document.getElementById('bulan').value = item.Bulan;
            document.getElementById('tahun').value = item.Tahun;
            
            scrollToSection('formSection');
        }
    }

    async function deleteData(id) {
        if(!confirm("Yakin ingin menghapus data ini?")) return;

        const formData = new URLSearchParams();
        formData.append('action', 'delete');
        formData.append('id', id);

        try {
            const response = await fetch(scriptURL, { method: 'POST', body: formData });
            const result = await response.json();
            if (result.success) {
                showMessage(result.message, 'success');
                loadDataAndSummary();
            } else {
                showMessage(result.error || 'Gagal menghapus data', 'error');
            }
        } catch (error) {
            console.error(error);
            showMessage("Koneksi ke server gagal!", 'error');
        }
    }

    function resetFilter() {
        document.getElementById('filterBulan').value = '';
        document.getElementById('filterTahun').value = '';
        if (role !== 'depo') {
            document.getElementById('filterDepo').value = '';
        }
        loadDataAndSummary();
    }

    function formatRupiah(angka) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
    }

    function showMessage(msg, type) {
        const msgDiv = document.getElementById('message');
        msgDiv.className = type;
        msgDiv.textContent = msg;
        setTimeout(() => { msgDiv.textContent = ''; }, 5000);
    }

    // Initial Load
    window.onload = function() {
        document.getElementById('tahun').value = new Date().getFullYear();
        loadDataAndSummary();
    };
</script>
</body>
</html>
